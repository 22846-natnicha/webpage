<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journal | Hobby</title>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Kalam:wght@400;700&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-paper-texture"></div>
    <div class="bg-soft-gradient"></div>

    <header class="navbar-wrapper">
        <nav class="scrapbook-nav">
            <div class="washi-tape tape-nav-top"></div>
            <div class="nav-container">
                <a href="index.html" class="logo">My<span>Journal</span> 📔</a>
                <ul class="nav-links">
                    <li><a href="index.html">หน้าแรก</a></li>
                    <li><a href="profile.html">ประวัติส่วนตัว</a></li>
                    <li><a href="education.html">การศึกษา</a></li>
                    <li><a href="hobby.html" class="active">งานอดิเรก</a></li>
                    <li><a href="contact.html">ติดต่อ</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-title-box">
            <h1 class="greeting">🎨 Chapter 3: Hobbies & Gallery</h1>
            <p class="handwritten">"สิ่งที่ชอบทำในเวลาว่างเพื่อสร้างแรงบันดาลใจ"</p>
        </div>

        <section class="gallery-grid">
            <div class="polaroid-frame">
                <div class="washi-tape tape-top-center"></div>
                <div class="img-container">
                    <img src="images/gallery-1.jpg" alt="งานอดิเรก 1" onerror="this.src='https://placehold.co/400x350/F7C6D0/3A3A3A?text=Drawing+Art';">
                </div>
                <p class="polaroid-caption">Drawing & Design 🖌️</p>
            </div>

            <div class="polaroid-frame" style="transform: rotate(-3deg);">
                <div class="washi-tape tape-corner-left"></div>
                <div class="img-container">
                    <img src="images/gallery-2.jpg" alt="งานอดิเรก 2" onerror="this.src='https://placehold.co/400x350/B3D8E8/3A3A3A?text=Listening+Music';">
                </div>
                <p class="polaroid-caption">Music & Podcast 🎧</p>
            </div>

            <div class="polaroid-frame" style="transform: rotate(2deg);">
                <div class="washi-tape tape-top-center"></div>
                <div class="img-container">
                    <img src="images/work-1.jpg" alt="งานอดิเรก 3" onerror="this.src='https://placehold.co/400x350/F4D35E/3A3A3A?text=Reading+Books';">
                </div>
                <p class="polaroid-caption">Reading Journals 📚</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
