<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก | My Portfolio</title>
    <style>
        /* =========================================
           1. ตั้งค่าพื้นฐานและพื้นหลังอวกาศมิติใหม่
           ========================================= */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #030312;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.1) 0%, transparent 40%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        #spaceCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, rgba(138, 43, 226, 0.05) 40%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            transition: 0.1s ease-out;
            mix-blend-mode: screen;
        }

        /* =========================================
           2. Navbar
           ========================================= */
        .navbar {
            background: rgba(3, 3, 18, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
            padding: 15px 50px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            color: #fff;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: #b3e0ff;
            text-decoration: none;
            transition: 0.3s;
            font-weight: 500;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #0ff;
            text-shadow: 0 0 15px #0ff;
        }

        /* =========================================
           3. โครงสร้างเนื้อหาหลัก (Hero Section)
           ========================================= */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .grid-2-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
            min-height: 65vh;
        }

        @media (max-width: 768px) {
            .grid-2-col {
                grid-template-columns: 1fr;
                text-align: center;
            }
        }

        .hero-content {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 24px;
            padding: 40px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2), 0 0 30px rgba(0, 255, 255, 0.1);
        }

        .badge {
            display: inline-block;
            background: linear-gradient(90deg, rgba(0, 255, 255, 0.1), rgba(138, 43, 226, 0.2));
            color: #0ff;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .hero-content h1 {
            font-size: 2.8rem;
            margin: 0 0 15px 0;
            line-height: 1.3;
        }

        .animated-text {
            background: linear-gradient(90deg, #00ffff, #ff00ff, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
            font-size: 3.2rem;
            font-weight: 800;
        }

        .subtitle {
            color: #d1d5db;
            font-size: 1.15rem;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        @media (max-width: 768px) {
            .button-group { justify-content: center; }
        }

        .
